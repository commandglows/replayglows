<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>ReplayGlows</title>
    <link href="/output.css" rel="stylesheet" />
    <style>
      body {
        width: 600px;
        height: 600px;
      }
    </style>
  </head>
  <body>
    <div class="flex flex-col h-[600px]">
      <h3 class="h3 p-6">Mes marque-pages YouTube</h3>
      <div id="bookmarks-list" class="flex-1 overflow-y-auto">
        <!-- Les bookmarks seront injectés ici par le JavaScript -->
      </div>
      <footer class="sct sticky bottom-0">
        <div class="flex justify-between w-full text-base">
          <div>
            <button id="settings" class="btn p-3 iso grad-br-static-sm">Options</button>
          </div>
          <div>
            <button id="export-markdown" class="btn p-3 iso grad-br-static-sm">Markdown</button>
            <button id="export-json" class="btn p-3 iso grad-br-static-sm">JSON</button>
          </div>
        </div>
      </footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
