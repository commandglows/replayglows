name: replayglows_app
description: ReplayGlows - Video Note-Taking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Authentication
  # Clerk is integrated through a web-only ClerkJS bridge.
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^6.3.0

  # Convex backend
  convex_flutter: ^3.0.1

  # Routing
  go_router: ^17.5.0

  # State management
  flutter_riverpod: ^3.4.3

  # YouTube player
  youtube_player_flutter: ^10.0.1

  # Web platform views
  web: ^1.1.1

  # UI components
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  just_audio: ^0.10.6

  # Storage
  path_provider: ^2.1.6
  shared_preferences: ^2.3.0

  # Utilities
  intl: ^0.20.3
  http: ^1.6.0
  record: ^6.2.1
  url_launcher: ^6.3.0
  sentry_flutter: ^9.29.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # convex_flutter 3.0.1 ships FRB-generated native bindings for 2.11.1.
  # Allowing pub to resolve flutter_rust_bridge 2.12.0 trips the runtime
  # sanity check before the app can initialise Convex on Android.
  flutter_rust_bridge: 2.11.1

flutter:
  uses-material-design: true
