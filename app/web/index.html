<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ReplayGlows - Video Note-Taking App">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ReplayGlows">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ReplayGlows</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #replayglows-boot-fallback {
      align-items: center;
      background: #f7f8fb;
      box-sizing: border-box;
      color: #1f2937;
      display: flex;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      inset: 0;
      justify-content: center;
      min-height: 100%;
      padding: 24px;
      position: fixed;
      z-index: 0;
    }

    #replayglows-boot-fallback.is-hidden {
      display: none;
    }

    .boot-panel {
      max-width: 420px;
      text-align: center;
    }

    .boot-mark {
      align-items: center;
      animation: boot-mark-pulse 1.35s ease-in-out infinite;
      background: #111827;
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.18);
      color: #ffffff;
      display: inline-flex;
      font-size: 18px;
      font-weight: 700;
      height: 44px;
      justify-content: center;
      margin-bottom: 18px;
      width: 44px;
    }

    @keyframes boot-mark-pulse {
      0%,
      100% {
        box-shadow: 0 10px 28px rgba(17, 24, 39, 0.18);
        transform: scale(1);
      }

      50% {
        box-shadow: 0 14px 34px rgba(17, 24, 39, 0.26);
        transform: scale(1.06);
      }
    }

    .boot-title {
      color: #111827;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 8px;
    }

    .boot-copy {
      color: #4b5563;
      font-size: 15px;
      line-height: 1.55;
      margin: 0;
    }

    .boot-help {
      animation: reveal-boot-help 0.2s linear 6s forwards;
      border-top: 1px solid #d9dee8;
      color: #374151;
      font-size: 14px;
      line-height: 1.55;
      margin-top: 18px;
      opacity: 0;
      padding-top: 18px;
    }

    .boot-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
    }

    .boot-actions a {
      border: 1px solid #c7ceda;
      border-radius: 6px;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 12px;
      text-decoration: none;
    }

    .boot-actions a:first-child {
      background: #111827;
      border-color: #111827;
      color: #ffffff;
    }

    @keyframes reveal-boot-help {
      to {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-mark {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="replayglows-boot-fallback" role="status" aria-live="polite">
    <div class="boot-panel">
      <div class="boot-mark" aria-hidden="true">R</div>
      <p class="boot-title">Opening ReplayGlows...</p>
      <p class="boot-copy">The app is loading in your browser.</p>
      <div class="boot-help">
        ReplayGlows could not finish loading. If you use Vivaldi, Brave, uBlock,
        or another privacy blocker, set this site to no blocking and allow
        app.replayglows.com and clerk.replayglows.com, then reload.
        <div class="boot-actions">
          <a href="/">Reload</a>
          <a href="https://replayglows.com">ReplayGlows site</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var fallback = document.getElementById('replayglows-boot-fallback');
      if (fallback) {
        fallback.className = 'is-hidden';
      }
    });
  </script>
  <script src="convex_bridge.js" defer></script>
  <script src="clerk_bridge.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
