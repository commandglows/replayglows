name: ReplayGlows Android Checks and Manual APK

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/replayglows-app-android.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/replayglows-app-android.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: "3.47.1"

defaults:
  run:
    working-directory: app

jobs:
  changes:
    name: Detect Android-impacting changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            android:
              - "app/android/**"
              - "app/lib/**"
              - "app/test/**"
              - "app/pubspec.yaml"
              - "app/pubspec.lock"
              - ".github/workflows/replayglows-app-android.yml"

  analyze:
    name: Android analyze
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    needs:
      - changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: replayglows-app-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock') }}

      - name: Cache Pub and Dart tool state
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: replayglows-app-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            replayglows-app-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            replayglows-app-pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

  test:
    name: Android tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    needs:
      - changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: replayglows-app-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock') }}

      - name: Cache Pub and Dart tool state
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
            app/build/test_cache
            app/build/unit_test_assets
          key: replayglows-app-test-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock', 'app/test/**') }}
          restore-keys: |
            replayglows-app-test-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            replayglows-app-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            replayglows-app-pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build-debug-apk:
    name: Manual Android debug APK build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    needs:
      - changes
      - analyze
      - test
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: replayglows-app-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock') }}

      - name: Cache Pub, Dart tool state, and Flutter build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
            app/build/native_assets
            app/build/app/intermediates
            app/build/app/kotlin
          key: replayglows-app-build-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock', 'app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            replayglows-app-build-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            replayglows-app-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            replayglows-app-pub-${{ runner.os }}-

      - name: Cache Gradle build state
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/android/.gradle
            app/android/app/build
          key: replayglows-app-gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            replayglows-app-gradle-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build metadata
        id: meta
        working-directory: .
        run: echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Validate required build configuration
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DEV_API_KEY: ${{ secrets.FIREBASE_DEV_API_KEY }}
          FIREBASE_DEV_APP_ID: ${{ secrets.FIREBASE_DEV_APP_ID }}
          FIREBASE_DEV_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_DEV_MESSAGING_SENDER_ID }}
          SUITE_IDENTITY_BRIDGE_URL: ${{ secrets.SUITE_IDENTITY_BRIDGE_URL }}
          REPLAYGLOWS_APP_URL: ${{ secrets.REPLAYGLOWS_APP_URL || vars.REPLAYGLOWS_APP_URL }}
        run: |
          missing=()
          for name in CONVEX_URL FIREBASE_PROJECT_ID FIREBASE_DEV_API_KEY FIREBASE_DEV_APP_ID FIREBASE_DEV_MESSAGING_SENDER_ID SUITE_IDENTITY_BRIDGE_URL REPLAYGLOWS_APP_URL; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing ReplayGlows Android build configuration: ${missing[*]}"
            exit 1
          fi

      - name: Build debug APK
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DEV_API_KEY: ${{ secrets.FIREBASE_DEV_API_KEY }}
          FIREBASE_DEV_APP_ID: ${{ secrets.FIREBASE_DEV_APP_ID }}
          FIREBASE_DEV_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_DEV_MESSAGING_SENDER_ID }}
          FIREBASE_DEV_AUTH_DOMAIN: ${{ secrets.FIREBASE_DEV_AUTH_DOMAIN }}
          FIREBASE_DEV_STORAGE_BUCKET: ${{ secrets.FIREBASE_DEV_STORAGE_BUCKET }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}
          SUITE_IDENTITY_BRIDGE_URL: ${{ secrets.SUITE_IDENTITY_BRIDGE_URL }}
          REPLAYGLOWS_APP_URL: ${{ secrets.REPLAYGLOWS_APP_URL || vars.REPLAYGLOWS_APP_URL }}
          REPLAYGLOWS_ACCOUNT_CENTER_URL: ${{ secrets.REPLAYGLOWS_ACCOUNT_CENTER_URL || vars.REPLAYGLOWS_ACCOUNT_CENTER_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT || vars.SENTRY_ENVIRONMENT }}
        run: |
          if [ -z "$REPLAYGLOWS_ACCOUNT_CENTER_URL" ]; then
            REPLAYGLOWS_ACCOUNT_CENTER_URL="https://winflows.com/account"
          fi
          if [ -z "$SENTRY_ENVIRONMENT" ]; then
            SENTRY_ENVIRONMENT="github-actions"
          fi

          flutter build apk --debug \
            --dart-define=CONVEX_URL="$CONVEX_URL" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_DEV_API_KEY="$FIREBASE_DEV_API_KEY" \
            --dart-define=FIREBASE_DEV_APP_ID="$FIREBASE_DEV_APP_ID" \
            --dart-define=FIREBASE_DEV_MESSAGING_SENDER_ID="$FIREBASE_DEV_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_DEV_AUTH_DOMAIN="${FIREBASE_DEV_AUTH_DOMAIN:-}" \
            --dart-define=FIREBASE_DEV_STORAGE_BUCKET="${FIREBASE_DEV_STORAGE_BUCKET:-}" \
            --dart-define=FIREBASE_WEB_CLIENT_ID="${FIREBASE_WEB_CLIENT_ID:-}" \
            --dart-define=SUITE_IDENTITY_BRIDGE_URL="${SUITE_IDENTITY_BRIDGE_URL:-}" \
            --dart-define=CLERK_SIGN_IN_URL="/sign-in" \
            --dart-define=CLERK_SIGN_UP_URL="/sign-up" \
            --dart-define=REPLAYGLOWS_PRODUCT_ID="replayglows" \
            --dart-define=REPLAYGLOWS_LEGACY_PRODUCT_IDS="tubeflow" \
            --dart-define=REPLAYGLOWS_ACCOUNT_CENTER_URL="$REPLAYGLOWS_ACCOUNT_CENTER_URL" \
            --dart-define=REPLAYGLOWS_APP_URL="$REPLAYGLOWS_APP_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT" \
            --dart-define=BUILD_COMMIT_SHA="${GITHUB_SHA}" \
            --dart-define=BUILD_ENVIRONMENT="github-actions" \
            --dart-define=BUILD_TIMESTAMP="${{ steps.meta.outputs.build_timestamp }}"

      - name: Verify debug APK exists
        run: test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Print debug APK signing certificate fingerprints
        run: |
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk \
            | sed -n '/SHA-1 digest:/p;/SHA-256 digest:/p'

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: replayglows-app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1
