version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend/packages/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      npm-patch-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "site"
    groups:
      npm-patch-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "pip"
    directory: "/lab"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "lab"
    groups:
      pip-patch-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "app"
    groups:
      pub-patch-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-patch-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "docker"
    directory: "/lab"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "lab"
      - "docker"
    groups:
      docker-patch-minor:
        update-types:
          - "patch"
          - "minor"
