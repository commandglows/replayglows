name: Android APK

on:
  push:
    branches: [main, master, android-ci]
    paths:
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main, master, android-ci]
    paths:
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-checks:
    name: Android checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-apk:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/android-ci'
    needs:
      - flutter-checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Flutter pub get
        run: flutter pub get

      - name: Build metadata
        id: meta
        run: |
          echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=CONVEX_URL=${{ secrets.CONVEX_URL }}
          --dart-define=CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
          --dart-define=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
          --dart-define=TUBEFLOW_APP_URL=${{ secrets.TUBEFLOW_APP_URL }}
          --dart-define=TUBEFLOW_WEB_URL=${{ secrets.TUBEFLOW_APP_URL }}
          --dart-define=CLERK_HOSTED_SIGN_IN_URL=${{ secrets.CLERK_HOSTED_SIGN_IN_URL }}
          --dart-define=BUILD_COMMIT_SHA=${{ github.sha }}
          --dart-define=BUILD_ENVIRONMENT=github-actions
          --dart-define=BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tubeflow-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
